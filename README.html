<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>無題.tivensy - 迪温書院 for linguistics</title>
<style>
/* ============================================================
   迪温書院 for linguistics — UI基盤
   ============================================================ */
:root{
  --desk-a:#55656f; --desk-b:#39454f;
  --chrome:#f7f9fa; --line:#ccd6de; --line-2:#e3e9ee;
  --ink:#1c2732; --ink-2:#54657a; --ink-3:#8797a6;
  --bar:#1f3547; --bar-2:#16293a; --bar-tx:#d8e4ec;
  --acc:#2b6393; --acc-ink:#1c4d78; --acc-soft:#e2eef8; --acc-line:#9cc0da;
  --seal:#bf4437;
  --hover:#eef3f8; --hover-b:#c8d8e4;
  --page-w:176mm; --page-h:250mm;
  --f-ui:"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  --f-min:"Yu Mincho","Hiragino Mincho ProN","MS PMincho","Noto Serif CJK JP",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#e9edf0;color:var(--ink);font-family:var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--acc-line);outline-offset:1px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}

#app{height:100vh;display:flex;flex-direction:column}

/* ---- トップバー ---- */
#topbar{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(180deg,var(--bar),var(--bar-2));color:var(--bar-tx);
  border-bottom:1px solid #0c1a26;user-select:none;box-shadow:0 1px 6px rgba(10,20,30,.25);z-index:40}
.seal-sm{width:27px;height:27px;display:grid;place-items:center;background:var(--seal);color:#fff;
  font-family:var(--f-min);font-size:10px;line-height:1;letter-spacing:.03em;border-radius:3px;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.4);transform:rotate(-2.5deg)}
.tb-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid rgba(255,255,255,.22);
  border-radius:5px;background:transparent;color:var(--bar-tx);font-size:12px;cursor:pointer;letter-spacing:.05em;transition:background .12s}
.tb-btn:hover{background:rgba(255,255,255,.1)}
.tb-btn .ic{width:13px;height:13px}
.tb-center{flex:1;display:flex;align-items:baseline;justify-content:center;min-width:0}
#doc-title{width:min(46ch,44vw);background:transparent;border:0;border-bottom:1px solid transparent;
  color:#f0f5f9;font-family:var(--f-min);font-size:14px;letter-spacing:.06em;text-align:center;padding:2px 4px}
#doc-title:hover{border-bottom-color:rgba(255,255,255,.25)}
#doc-title:focus{outline:none;border-bottom-color:rgba(255,255,255,.55)}
.tb-ext{color:#7f97a9;font-size:11px}
.tb-right{display:flex;align-items:center;gap:6px}
#draft-state{font-size:10.5px;color:#8ba2b3;letter-spacing:.04em;min-width:96px;text-align:right}
.tb-ico{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:5px;background:transparent;
  color:#c9d9e4;cursor:pointer;transition:background .12s}
.tb-ico:hover{background:rgba(255,255,255,.12)}
.tb-ico .ic{width:16px;height:16px}
.tb-sep{width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 3px}

/* ---- リボン ---- */
#ribbon{flex:none;background:var(--chrome);border-bottom:1px solid var(--line);z-index:30}
#ribbon-tabs{display:flex;gap:2px;padding:5px 10px 0;border-bottom:1px solid var(--line)}
.ribbon-tab{position:relative;padding:7px 16px 8px;border:0;background:none;font-size:12.5px;
  color:var(--ink-2);cursor:pointer;letter-spacing:.06em}
.ribbon-tab:hover{color:var(--ink)}
.ribbon-tab.active{color:var(--ink);font-weight:600}
.ribbon-tab::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;border-radius:2px;
  background:var(--seal);transform:scaleX(0);transition:transform .18s ease}
.ribbon-tab.active::after{transform:scaleX(1)}
#ribbon-pages{height:106px;overflow-x:auto;overflow-y:hidden;background:linear-gradient(#fdfefe,#f4f7f9)}
#ribbon-pages::-webkit-scrollbar{height:7px}
#ribbon-pages::-webkit-scrollbar-thumb{background:#c2ced8;border-radius:4px}
.ribbon-page{display:none;height:100%;align-items:stretch}
.ribbon-page.show{display:flex;animation:fadein .16s ease}
@keyframes fadein{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.ribbon-group{display:flex;flex-direction:column;flex:none;padding:6px 10px 2px;border-right:1px solid var(--line-2)}
.ribbon-row{flex:1;display:flex;align-items:center;gap:2px}
.ribbon-col{display:flex;flex-direction:column;gap:2px}
.ribbon-group-title{font-size:9.5px;color:var(--ink-3);text-align:center;padding:3px 0 1px;letter-spacing:.1em}

.rb{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:28px;height:28px;padding:0 6px;
  border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;font-size:12px;color:var(--ink);
  white-space:nowrap;transition:background .1s,border-color .1s}
.rb .ic{width:17px;height:17px;color:#31465c}
.rb:hover{background:var(--hover);border-color:var(--hover-b)}
.rb:active{background:#e0eaf2}
.rb.on{background:var(--acc-soft);border-color:var(--acc-line)}
.rb.on .ic{color:var(--acc-ink)}
.rb:disabled{opacity:.4;pointer-events:none}
.rb.lg{flex-direction:column;min-width:60px;height:78px;gap:5px}
.rb.lg .ic{width:24px;height:24px}
.rb .lbl{font-size:11px;line-height:1.2}
.rb.ch{min-width:27px;font-family:Georgia,"Times New Roman",serif;font-size:14px;color:#2c4257}
.rb.ch.g{font-family:Consolas,"Segoe UI",sans-serif;font-size:10.5px;letter-spacing:.02em}
.rctl{height:26px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-size:12px;padding:0 4px;cursor:pointer}
.rctl:focus{border-color:var(--acc-line);outline:none}
.sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(20,35,50,.28);cursor:pointer;padding:0;transition:transform .1s}
.sw:hover{transform:translateY(-1.5px);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.sw.custom{background:conic-gradient(#e55,#ea3,#7b5,#39c,#a4d,#e55);position:relative;overflow:hidden}
.sw.custom input{position:absolute;inset:-4px;opacity:0;cursor:pointer}

/* ---- ワークスペース / 原稿用紙 ---- */
#workspace{flex:1;overflow:auto;position:relative;
  background:radial-gradient(130% 100% at 50% 4%,var(--desk-a) 0%,#47555f 48%,var(--desk-b) 100%)}
#page-stage{zoom:1;min-width:max-content;min-height:100%}
#pages{display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 56px 72px}
.document-page{position:relative;width:var(--page-w);height:var(--page-h);flex:0 0 auto;overflow:hidden;background:#fff;
  box-shadow:0 1px 2px rgba(12,22,32,.3),0 12px 30px rgba(12,22,32,.32);transition:box-shadow .2s}
.document-page.current{box-shadow:0 0 0 1.5px rgba(140,190,225,.6),0 1px 2px rgba(12,22,32,.3),0 12px 30px rgba(12,22,32,.32)}
.page-frame{position:absolute;inset:8mm;border:.3mm solid #8aa0b2;pointer-events:none;z-index:1}
.page-frame::before,.page-frame::after{content:"";position:absolute;width:5mm;height:5mm}
.page-frame::before{top:-.3mm;left:-.3mm;border-top:.8mm solid #35596f;border-left:.8mm solid #35596f}
.page-frame::after{right:-.3mm;bottom:-.3mm;border-right:.8mm solid #35596f;border-bottom:.8mm solid #35596f}
.page-logo{position:absolute;z-index:2;color:#35596f;font-family:var(--f-min);font-size:7.5pt;
  letter-spacing:.06em;pointer-events:none;user-select:none;background:#fff;padding:0 3mm}
.page-logo.top{top:3.3mm;left:50%;transform:translateX(-50%)}
.page-logo.bottom{bottom:3.2mm;left:50%;transform:translateX(-50%)}
.page-number{position:absolute;left:0;right:0;bottom:3.15mm;z-index:2;color:#5f788a;font-size:8pt;
  text-align:center;pointer-events:none;user-select:none}
#stage.no-decor .page-frame,#stage.no-decor .page-logo,#stage.no-decor .page-number{visibility:hidden}

.editor{position:absolute;inset:15mm 16mm 16mm;z-index:3;overflow:hidden;outline:none;color:#111;
  font-family:var(--f-min);font-size:11pt;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;caret-color:#1c5d8d}
.editor:empty::before{content:"ここに文章を入力してください。";color:#9aa7b0;pointer-events:none}
.editor p{margin:0 0 .7em;min-height:1em}
.editor h1{font-size:20pt;margin:.1em 0 .7em;line-height:1.4}
.editor h2{font-size:15pt;margin:.5em 0 .6em;line-height:1.5}
.editor blockquote{margin:.8em 1.5em;padding-left:1em;border-left:3px solid #8fa8ba;color:#394c59}
.editor ul,.editor ol{margin:.4em 0 .7em;padding-left:1.8em}
.editor table{border-collapse:collapse;margin:.6em 0;min-width:30%}
.editor th,.editor td{border:1px solid #57708a;padding:4px 8px;min-width:2.4em;vertical-align:top;text-align:left}
.editor th{background:#eaf1f6;font-weight:700}
.editor .selcell{background:#d8e9f8!important}
.linguistic-example{display:grid;grid-template-columns:9mm 1fr;margin:.65em 0}
.example-number{color:#40596a}
.ipa-text{font-family:"Charis SIL","Doulos SIL","Segoe UI",sans-serif}
.gloss-table{border-collapse:separate!important;border-spacing:.9em 0!important;margin:0!important}
.gloss-table td{border:none!important;padding:0!important;white-space:nowrap}
.tree-block{margin:.8em 0;padding:.8em 1em;border:1px solid #abc1d0;background:#f7fafc;
  font-family:Consolas,Menlo,monospace;font-size:9.5pt;line-height:1.4;white-space:pre}

/* ---- ステータスバー ---- */
#statusbar{flex:none;min-height:30px;display:flex;align-items:center;gap:10px;padding:3px 12px;
  background:linear-gradient(180deg,var(--bar),var(--bar-2));color:#c3d3df;font-size:11.5px;border-top:1px solid #0c1a26}
#status-message{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item{white-space:nowrap}
.sb-sep{width:1px;height:14px;background:rgba(255,255,255,.18)}
.sb-zoom{display:flex;align-items:center;gap:6px}
#zoom-slider{width:110px;accent-color:#7fb0d8}
.sb-btn{width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:4px;background:transparent;
  color:#c9d9e4;cursor:pointer}
.sb-btn:hover{background:rgba(255,255,255,.12)}
.sb-btn .ic{width:14px;height:14px}

/* ---- 表ツール（フロート） ---- */
#table-tools{position:fixed;z-index:300;display:flex;align-items:center;gap:2px;padding:4px 6px;
  background:#24374a;border:1px solid #14232f;border-radius:8px;box-shadow:0 8px 22px rgba(8,16,26,.4);color:#d7e3ec}
#table-tools .tt-cap{font-size:10px;letter-spacing:.12em;color:#8fb2cc;padding:0 6px 0 4px}
#table-tools .rb{height:26px;min-width:26px;color:#d7e3ec}
#table-tools .rb .ic{width:16px;height:16px;color:#cfe0ec}
#table-tools .rb:hover{background:#35506a;border-color:transparent}
#table-tools .sep{width:1px;height:18px;background:#3d5871;margin:0 3px}

/* ---- メニュー / ポップオーバー ---- */
.menu{position:fixed;z-index:500;min-width:200px;padding:5px;background:#fff;border:1px solid #c4cfda;
  border-radius:8px;box-shadow:0 10px 30px rgba(15,25,35,.25);animation:fadein .12s ease}
.menu-item{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:5px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.menu-item .ic{width:16px;height:16px;color:#46607a}
.menu-item:hover{background:var(--acc-soft)}
.menu-item.disabled{opacity:.4;pointer-events:none}
.menu-sep{height:1px;background:var(--line-2);margin:5px 6px}
.pop{position:fixed;z-index:520;background:#fff;border:1px solid #c4cfda;border-radius:8px;
  box-shadow:0 10px 30px rgba(15,25,35,.25);padding:10px;animation:fadein .12s ease}
#tg-label{font-size:11.5px;color:var(--ink-2);text-align:center;margin-bottom:7px}
#tg-grid{display:grid;grid-template-columns:repeat(8,16px);gap:3px}
.tg-cell{width:16px;height:16px;border:1px solid #c2ced8;border-radius:2px;background:#fff;cursor:pointer;padding:0}
.tg-cell.lit{background:var(--acc-soft);border-color:var(--acc)}
#tg-more{margin-top:8px;width:100%;font-size:11.5px;color:var(--acc-ink);background:none;border:0;cursor:pointer;padding:4px}
#tg-more:hover{text-decoration:underline}

/* ---- モーダル ---- */
#modal-overlay{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;
  background:rgba(16,28,40,.48);backdrop-filter:blur(2px)}
#modal{width:min(520px,calc(100vw - 28px));background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 18px 50px rgba(8,16,26,.45);animation:mpop .16s ease}
@keyframes mpop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
#modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
  border-bottom:1px solid var(--line-2);background:#f8fafb}
#modal-title{font-family:var(--f-min);font-size:15px;letter-spacing:.06em;color:#22384c}
#modal-close{border:0;background:none;cursor:pointer;color:var(--ink-3);width:26px;height:26px;display:grid;place-items:center;border-radius:5px}
#modal-close:hover{background:var(--hover);color:var(--ink)}
#modal-close .ic{width:15px;height:15px}
#modal-body{padding:14px 16px;font-size:13px;color:#33444f;line-height:1.6;max-height:64vh;overflow:auto}
#modal-body .msg{margin-bottom:10px;white-space:pre-line}
.m-field{margin-bottom:10px}
.m-field label{display:block;font-size:11px;color:var(--ink-2);margin-bottom:4px;letter-spacing:.05em}
.m-field input[type=text],.m-field input[type=number],.m-field select,.m-field textarea{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:13px}
.m-field textarea{min-height:130px;resize:vertical;font-family:Consolas,Menlo,monospace;font-size:12px;line-height:1.5}
.m-field input:focus,.m-field textarea:focus,.m-field select:focus{outline:none;border-color:var(--acc-line);box-shadow:0 0 0 3px rgba(43,99,147,.12)}
.m-radios{display:flex;gap:14px;font-size:12.5px}
.m-radios label{display:flex;align-items:center;gap:5px;cursor:pointer}
#modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;background:#f6f8fa;border-top:1px solid var(--line-2)}
.btn{padding:7px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--acc);border-color:var(--acc-ink);color:#fff;font-weight:600}
.btn.primary:hover{background:#255680}
.kbd{display:inline-block;min-width:18px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;background:#f4f6f8;font-size:11px;text-align:center;font-family:Consolas,monospace}
.help-t{margin:12px 0 6px;font-size:12px;color:var(--acc-ink);letter-spacing:.08em}
.help-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12px;color:#3d4e5c}

/* ---- スプラッシュ ---- */
#splash{position:fixed;inset:0;z-index:900;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 50% 18%,#1e3c57 0%,#14293c 55%,#0c1b29 100%);transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-seal{width:76px;height:76px;margin:0 auto;display:grid;place-items:center;background:var(--seal);border-radius:8px;
  color:#fff;font-family:var(--f-min);font-size:23px;letter-spacing:.1em;transform:rotate(-3deg);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),0 12px 32px rgba(0,0,0,.45);
  animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{transform:rotate(-3deg) scale(1.7);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.sp-title{margin-top:26px;font-family:var(--f-min);font-size:40px;font-weight:400;color:#eef4f8;
  letter-spacing:.16em;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.sp-sub{margin-top:10px;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#8fb2cc;text-align:center}
.sp-rule{width:210px;margin:24px auto 0;border-top:1px solid rgba(210,225,238,.35);position:relative}
.sp-rule::after{content:"";position:absolute;left:50%;top:-3px;width:5px;height:5px;background:var(--seal);
  transform:translateX(-50%) rotate(45deg)}
.sp-bar{width:210px;height:2px;margin:26px auto 0;background:rgba(255,255,255,.14);overflow:hidden;border-radius:2px}
.sp-bar i{display:block;height:100%;width:40%;background:#cfe3f2;border-radius:2px;animation:load 1s ease-in-out infinite}
@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
.sp-copy{margin-top:18px;text-align:center;font-size:10.5px;color:#6f8ba1;letter-spacing:.14em}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============================================================
   印刷（B5厳密出力）
   ============================================================ */
@page{size:176mm 250mm;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #topbar,#ribbon,#statusbar,#splash,#table-tools,#context-menu,#modal-overlay,.menu,.pop{display:none!important}
  #workspace{position:static;display:block;overflow:visible;background:#fff;padding:0;margin:0}
  #page-stage{zoom:1!important;transform:none!important;min-width:0;min-height:0;padding:0}
  #pages{display:block;padding:0;margin:0;gap:0}
  .document-page{width:176mm;height:250mm;margin:0;box-shadow:none;overflow:hidden;
    break-after:page;page-break-after:always}
  .document-page:last-child{break-after:auto;page-break-after:auto}
  .page-frame,.page-logo,.page-number{display:block!important;visibility:visible!important}
  .editor{caret-color:transparent}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V4h10v4"/><path d="M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v6H7z"/></symbol>

<symbol id="i-copy" viewBox="0 0 24 24"><path d="M5 14.5h-.5A1.5 1.5 0 0 1 3 13V4.5A1.5 1.5 0 0 1 4.5 3H13a1.5 1.5 0 0 1 1.5 1.5V5"/><rect x="8" y="8" width="13" height="13" rx="1.5"/></symbol>

<script>
"use strict";
/* ================================================================
   迪温書院 for linguistics  v1.0
   ================================================================ */
const APP_NAME="迪温書院 for linguistics";
const APP_VERSION="1.0";
const EXT=".tivensy";
const FORMAT="tivensy-linguistics-document";
const LOGO=APP_NAME;
const DRAFT_KEY="teinShoinDraft.v1";
const MAX_HISTORY=120;

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const icon=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

let currentFileName=null,fileHandle=null,modified=false;
let activePageIndex=0,zoomPercent=100;
let undoStack=[],redoStack=[],savedRange=null;
let typingBurst=false,burstTimer=null,repagTimer=null,cleanTimer=null,draftTimer=null;

/* ---------------- 基本ユーティリティ ---------------- */
function setStatus(m){$("#status-message").textContent=m}
function getPages(){return $$("#pages .document-page")}
function editorOf(p){return $(".editor",p)}
function idxOf(p){return getPages().indexOf(p)}
function getActiveEditor(){const ps=getPages();return editorOf(ps[activePageIndex]||ps[0])||null}
function sanitizeName(v){const r=String(v||"").trim().replace(/[\\/:*?"<>|]/g,"_");return r||"無題"}

function updateTitle(){
  const name=currentFileName||"無題";
  document.title=`${modified?"*":""}${name}${EXT} - ${APP_NAME}`;
  const t=$("#doc-title");
  if(document.activeElement!==t)t.value=name;
}
function markModified(msg){modified=true;updateTitle();setStatus(msg||"文書を変更しました");scheduleDraft()}

/* ---------------- ページ生成 ---------------- */
function createPage(html="",opts={}){
  const page=document.createElement("section");
  page.className="document-page";
  if(opts.auto)page.dataset.auto="1";
  page.innerHTML=`
    <div class="page-frame"></div>
    <div class="page-logo top">${esc(LOGO)}</div>
    <div class="page-logo bottom">${esc(LOGO)}</div>
    <div class="page-number"></div>
    <article class="editor" contenteditable="true" spellcheck="false" aria-label="文書編集領域"></article>`;
  const ed=editorOf(page);
  ed.innerHTML=html;

  ed.addEventListener("focus",()=>{
    activePageIndex=Math.max(0,idxOf(page));
    $$(".document-page").forEach(p=>p.classList.toggle("current",p===page));
    updateStats();
  });
  ed.addEventListener("mouseup",saveSelection);
  ed.addEventListener("keyup",saveSelection);
  ed.addEventListener("beforeinput",e=>{
    if(e.inputType&&!/^history/.test(e.inputType))beginBurst();
  });
  ed.addEventListener("input",()=>{
    markModified("入力中...");
    endBurstLater();
    flowForward(idxOf(page));
    updateStats();
    scheduleCleanup();
  });
  ed.addEventListener("paste",e=>{
    if(!e.clipboardData)return;
    e.preventDefault();
    insertTextAtSelection(e.clipboardData.getData("text/plain"));
  });
  ed.addEventListener("keydown",e=>onEditorKeydown(e,page));
  ed.addEventListener("contextmenu",e=>{
    e.preventDefault();
    activePageIndex=Math.max(0,idxOf(page));
    showContextMenu(e.clientX,e.clientY);
  });
  $("#pages").appendChild(page);
  refreshPageNumbers();
  return page;
}
function refreshPageNumbers(){
  getPages().forEach((p,i)=>$(".page-number",p).textContent=String(i+1));
}
function updateStats(){
  const ps=getPages();
  activePageIndex=Math.min(Math.max(0,activePageIndex),Math.max(0,ps.length-1));
  const text=ps.map(p=>editorOf(p).innerText).join("\n").replace(/\s+/g,"");
  $("#page-indicator").textContent=`${ps.length?activePageIndex+1:0} / ${ps.length} 頁`;
  $("#word-count").textContent=`文字数 ${text.length.toLocaleString("ja-JP")}`;
}

/* ---------------- 履歴（入力バースト単位） ---------------- */
function snapshot(){return{pages:getPages().map(p=>editorOf(p).innerHTML),activePageIndex}}
function pushUndoNow(){
  const snap=snapshot();
  const ser=JSON.stringify(snap);
  if(undoStack.length&&JSON.stringify(undoStack[undoStack.length-1])===ser)return;
  undoStack.push(snap);
  if(undoStack.length>MAX_HISTORY)undoStack.shift();
  redoStack=[];
}
function beginBurst(){if(typingBurst)return;typingBurst=true;pushUndoNow()}
function endBurstLater(){clearTimeout(burstTimer);burstTimer=setTimeout(()=>typingBurst=false,800)}

function applySnapshot(snap,msg){
  pushTargets(snap.pages,msg);
  activePageIndex=Math.min(snap.activePageIndex||0,snap.pages.length-1);
  const ed=getActiveEditor();
  requestAnimationFrame(()=>{
    let restored=false;
    if(savedRange&&ed&&ed.contains(savedRange.startContainer)){
      const sel=window.getSelection();sel.removeAllRanges();
      try{sel.addRange(savedRange);restored=true}catch(_){}
    }
    if(!restored&&ed)placeCaretEnd(ed);
  });
}
function pushTargets(pages,msg){
  $("#pages").innerHTML="";
  (pages.length?pages:[""]).forEach(h=>createPage(h));
  typingBurst=false;
  refreshPageNumbers();updateStats();
  modified=true;updateTitle();setStatus(msg);
  scheduleDraft();
}
function undo(){
  if(!undoStack.length){setStatus("これ以上元に戻せません");return}
  redoStack.push(snapshot());
  applySnapshot(undoStack.pop(),"元に戻しました");
}
function redo(){
  if(!redoStack.length){setStatus("これ以上やり直せません");return}
  undoStack.push(snapshot());
  applySnapshot(redoStack.pop(),"やり直しました");
}

/* ---------------- 選択範囲 ---------------- */
function saveSelection(){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return;
  const r=sel.getRangeAt(0);
  for(const p of getPages()){
    if(editorOf(p).contains(r.commonAncestorContainer)){savedRange=r.cloneRange();return}
  }
}
function currentRange(){
  const sel=window.getSelection();
  return sel&&sel.rangeCount?sel.getRangeAt(0):null;
}
function containsCaret(el){
  const sel=window.getSelection();
  return !!(sel&&sel.anchorNode&&el.contains(sel.anchorNode));
}
function placeCaret(el,toStart){
  const r=document.createRange();
  r.selectNodeContents(el);r.collapse(toStart);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
  savedRange=r.cloneRange();
  const page=el.closest(".document-page");
  if(page){activePageIndex=idxOf(page);
    $$(".document-page").forEach(p=>p.classList.toggle("current",p===page));}
  saveSelection();
}
const placeCaretStart=el=>placeCaret(el,true);
const placeCaretEnd=el=>placeCaret(el,false);
function focusActiveEditor(){
  const ed=getActiveEditor();if(!ed)return null;
  ed.focus();
  if(savedRange&&ed.contains(savedRange.startContainer)){
    const sel=window.getSelection();sel.removeAllRanges();
    try{sel.addRange(savedRange)}catch(_){placeCaretEnd(ed)}
  }
  return ed;
}
function rangeFromSavedOrEnd(ed){
  if(savedRange&&ed.contains(savedRange.startContainer)){
    const r=savedRange.cloneRange();
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
    return r;
  }
  const r=document.createRange();
  r.selectNodeContents(ed);r.collapse(false);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
  return r;
}

/* ---------------- 挿入・書式 ---------------- */
function insertHtmlAtSelection(html,msg){
  const ed=getActiveEditor();if(!ed)return;
  ed.focus();
  pushUndoNow();
  const range=rangeFromSavedOrEnd(ed);
  range.deleteContents();
  const frag=range.createContextualFragment(html);
  const last=frag.lastChild;
  range.insertNode(frag);
  if(last){range.setStartAfter(last);range.collapse(true);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);}
  saveSelection();
  markModified(msg||"項目を挿入しました");
  flowForward(idxOf(ed.closest(".document-page")));
  updateStats();scheduleCleanup();
}
function insertTextAtSelection(text){
  insertHtmlAtSelection(esc(text).replace(/\n/g,"<br>"),"テキストを挿入しました");
}
function exec(cmd,val,msg){
  focusActiveEditor();
  pushUndoNow();
  document.execCommand(cmd,false,val);
  saveSelection();
  markModified(msg||"書式を変更しました");
  scheduleCleanup();
}
function applyBlock(tag){exec("formatBlock",tag,`段落スタイルを変更しました`)}
const SIZES=[8,9,10,10.5,11,12,13,14,16,18,20,24,28];
function setFontSize(pt,msg){
  const ed=focusActiveEditor();if(!ed)return;
  pushUndoNow();
  document.execCommand("styleWithCSS",false,false);
  document.execCommand("fontSize",false,"7");
  document.execCommand("styleWithCSS",false,true);
  $$('font[size="7"]',ed).forEach(f=>{f.removeAttribute("size");f.style.fontSize=pt+"pt"});
  saveSelection();markModified(msg||`文字サイズを ${pt}pt にしました`);
}
function currentSizePt(){
  const r=currentRange();if(!r)return 11;
  let n=r.startContainer;
  if(n.nodeType===Node.TEXT_NODE)n=n.parentElement;
  if(!n)return 11;
  return parseFloat(getComputedStyle(n).fontSize)*72/96;
}
function growFont(dir){
  const cur=currentSizePt();
  const next=dir>0?SIZES.find(s=>s>cur+.25):[...SIZES].reverse().find(s=>s<cur-.25);
  if(next)setFontSize(next);else setStatus("この以上変更できません");
}
function setLineHeight(v){
  const ed=focusActiveEditor();if(!ed)return;
  const r=currentRange();if(!r)return;
  pushUndoNow();
  $$("#pages .editor").forEach(()=>{});
  $$(":scope > *",ed).forEach(block=>{
    try{if(r.intersectsNode(block))block.style.lineHeight=v}catch(_){}
  });
  markModified(`行間を ${v} にしました`);
  flowForward(idxOf(ed.closest(".document-page")));
}

/* ---------------- 自動改ページ（溢出を次ページへ流す） ---------------- */
function ensureBlocks(ed){
  [...ed.childNodes].forEach(n=>{
    if(n.nodeType===Node.TEXT_NODE||(n.nodeType===1&&n.tagName==="BR")){
      const p=document.createElement("p");
      const txt=n.nodeType===3?n.textContent:"";
      p.innerHTML=txt?esc(txt):"<br>";
      ed.replaceChild(p,n);
    }
  });
}
function ensureNextPage(i){
  const ps=getPages();
  if(ps[i+1])return ps[i+1];
  return createPage("",{auto:true});
}
function flowForward(i){
  let guard=0;
  while(guard++<400){
    const ps=getPages();const page=ps[i];if(!page)break;
    const ed=editorOf(page);
    if(ed.scrollHeight<=ed.clientHeight+2)break;
    ensureBlocks(ed);
    const kids=[...ed.children];
    if(kids.length<=1)break;
    const last=kids[kids.length-1];
    const had=containsCaret(last);
    const next=ensureNextPage(i);
    editorOf(next).insertBefore(last,editorOf(next).firstChild);
    if(had){activePageIndex=i+1;saveSelection()}
  }
  const ps=getPages();
  if(ps[i+1]){
    const ned=editorOf(ps[i+1]);
    if(ned.scrollHeight>ned.clientHeight+2)flowForward(i+1);
  }
  refreshPageNumbers();
}
function flowBack(i){
  const ps=getPages();const page=ps[i],next=ps[i+1];
  if(!page||!next)return;
  const ed=editorOf(page),ned=editorOf(next);
  ensureBlocks(ed);ensureBlocks(ned);
  for(;;){
    const first=ned.firstElementChild;
    if(!first)break;
    if(containsCaret(first))break;
    ed.appendChild(first);
    if(ed.scrollHeight>ed.clientHeight+2){ned.insertBefore(first,ned.firstChild);break}
  }
}
function rebalanceAll(){
  getPages().forEach((p,i)=>{const ed=editorOf(p);
    if(ed.scrollHeight>ed.clientHeight+2)flowForward(i)});
  for(let i=getPages().length-1;i>=1;i--){
    const p=getPages()[i];if(!p)continue;
    const ed=editorOf(p);
    if(p.dataset.auto&&!ed.textContent.trim()&&!containsCaret(ed))p.remove();
  }
  for(let i=0;i<getPages().length-1;i++)flowBack(i);
  for(let i=getPages().length-1;i>=1;i--){
    const p=getPages()[i];if(!p)continue;
    const ed=editorOf(p);
    if(p.dataset.auto&&!ed.textContent.trim()&&!containsCaret(ed))p.remove();
  }
  refreshPageNumbers();updateStats();
}
function scheduleCleanup(){clearTimeout(cleanTimer);cleanTimer=setTimeout(()=>{rebalanceAll();updateTools()},650)}

function atEditorStart(ed){
  const sel=window.getSelection();
  if(!sel.isCollapsed||!sel.rangeCount)return false;
  const r=sel.getRangeAt(0);
  const pre=r.cloneRange();
  pre.selectNodeContents(ed);
  pre.setEnd(r.startContainer,r.startOffset);
  return pre.toString()==="";
}
function mergeWithPrev(i){
  const ps=getPages();const page=ps[i];
  if(i<1||!page)return;
  pushUndoNow();
  const ped=editorOf(ps[i-1]),ed=editorOf(page);
  ensureBlocks(ed);
  const kids=[...ed.children];const first=kids[0]||null;
  kids.forEach(k=>ped.appendChild(k));
  page.remove();
  activePageIndex=i-1;
  refreshPageNumbers();
  if(first)placeCaretStart(first);else placeCaretEnd(ped);
  markModified("ページを結合しました");
  updateStats();updateTools();
}
function insertPageBreak(){
  const ed=getActiveEditor();if(!ed)return;
  ed.focus();
  const r=currentRange();if(!r||!ed.contains(r.startContainer)){addPage();return}
  pushUndoNow();
  const range=r.cloneRange();
  range.setEnd(ed,ed.childNodes.length);
  const frag=range.extractContents();
  const page=ed.closest(".document-page");
  const idx=idxOf(page);
  const ps=getPages();
  let next=ps[idx+1];
  if(!next)next=createPage("",{auto:false});
  else getPages().splice;
  // next が存在する場合、その先頭へ。新規の場合は作成直後へ。
  const ned=editorOf(next);
  if(!next.isConnected){page.after(next)}
  if(!frag.textContent.trim())frag.appendChild(document.createElement("br"));
  const firstMoved=frag.firstChild;
  ned.insertBefore(frag,ned.firstChild);
  if(ed.childNodes.length===0)ed.innerHTML="<p><br></p>";
  activePageIndex=idxOf(next);
  if(firstMoved&&firstMoved.nodeType===1)placeCaretStart(firstMoved);else placeCaretStart(ned);
  markModified("改ページを挿入しました");
  flowForward(idxOf(next));updateStats();refreshPageNumbers();
}
function addPage(focus=true){
  pushUndoNow();
  const page=createPage("");
  activePageIndex=getPages().length-1;
  refreshPageNumbers();
  if(focus)editorOf(page).focus();
  page.scrollIntoView({behavior:"smooth",block:"center"});
  markModified("ページを追加しました");
}
async function deleteCurrentPage(){
  const ps=getPages();
  if(ps.length<=1){
    const r=await confirmYN("ページの削除","最後のページは削除できません。内容を空にしますか？");
    if(r==="yes"){pushUndoNow();getActiveEditor().innerHTML="";markModified("ページを空にしました")}
    return;
  }
  const r=await confirmYN("ページの削除",`${activePageIndex+1} ページ目を削除しますか？`);
  if(r!=="yes")return;
  pushUndoNow();
  ps[activePageIndex].remove();
  activePageIndex=Math.max(0,activePageIndex-1);
  refreshPageNumbers();updateStats();
  markModified("ページを削除しました");
  getActiveEditor()?.focus();
}

/* ---------------- エディタキー操作 ---------------- */
function cellOf(node){
  if(!node)return null;
  const el=node.nodeType===1?node:node.parentElement;
  return el?el.closest("td,th"):null;
}
function onEditorKeydown(e,page){
  const i=idxOf(page),ed=editorOf(page);
  if(e.key==="Backspace"&&!e.shiftKey&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&i>0&&atEditorStart(ed)){
    e.preventDefault();mergeWithPrev(i);return;
  }
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();insertPageBreak();return}
  if(e.key==="Tab"){
    const cell=cellOf(window.getSelection()?.anchorNode);
    if(!cell)return;
    e.preventDefault();
    const table=cell.closest("table");
    const list=cellsInOrder(table);
    const idx=list.indexOf(cell);
    if(e.shiftKey){if(idx>0)placeCaretStart(list[idx-1])}
    else if(idx<list.length-1)placeCaretStart(list[idx+1]);
    else{
      pushUndoNow();
      const {cols}=tableMatrix(table);
      const tr=document.createElement("tr");
      for(let c=0;c<cols;c++){const td=document.createElement("td");td.innerHTML="<br>";tr.appendChild(td)}
      table.appendChild(tr);
      placeCaretStart(tr.cells[0]);
      markModified("行を追加しました");
    }
    updateTools();
  }
}

/* ================================================================
   表エンジン
   ================================================================ */
function tableMatrix(table){
  const rows=table.rows.length,grid=[];let cols=0;
  for(let r=0;r<rows;r++){
    grid[r]=grid[r]||[];let c=0;
    for(const cell of table.rows[r].cells){
      while(grid[r][c])c++;
      const rs=cell.rowSpan||1,cs=cell.colSpan||1;
      for(let i=0;i<rs;i++){grid[r+i]=grid[r+i]||[];
        for(let j=0;j<cs;j++)grid[r+i][c+j]=cell}
      c+=cs;
    }
    cols=Math.max(cols,grid[r].length);
  }
  return{grid,rows,cols};
}
function spanOf(grid,r,cell){
  let start=-1,end=-1;
  grid[r].forEach((v,c)=>{if(v===cell){if(start<0)start=c;end=c}});
  return{start,end};
}
function cellsInOrder(table){
  const {grid}=tableMatrix(table);
  const seen=new Set,out=[];
  grid.forEach(row=>row.forEach(c=>{if(c&&!seen.has(c)){seen.add(c);out.push(c)}}));
  return out;
}
function newCell(){const td=document.createElement("td");td.innerHTML="<br>";return td}

function insertRow(table,refIdx,after){
  const {cols}=tableMatrix(table);
  const tr=document.createElement("tr");
  for(let c=0;c<cols;c++)tr.appendChild(newCell());
  const ref=table.rows[refIdx];
  if(after)ref.parentNode.insertBefore(tr,ref.nextSibling);
  else ref.parentNode.insertBefore(tr,ref);
  placeCaretStart(tr.cells[0]);
}
function insertColumn(table,c,after){
  const {grid,rows}=tableMatrix(table);
  const pos=after?c+1:c;
  for(let r=0;r<rows;r++){
    const tr=table.rows[r];let done=false;
    for(const cell of [...tr.cells]){
      const {start,end}=spanOf(grid,r,cell);
      if(start<pos&&pos<=end){cell.colSpan++;done=true;break}
      if(start>=pos){tr.insertBefore(newCell(),cell);done=true;break}
    }
    if(!done)tr.appendChild(newCell());
  }
}
function deleteRow(table,r){
  const tr=table.rows[r];if(!tr)return;
  const {grid}=tableMatrix(table);
  for(const cell of [...tr.cells]){
    const rs=cell.rowSpan||1;
    if(rs>1){
      cell.rowSpan=rs-1;
      let anchor=-1;
      for(let rr=0;rr<grid.length;rr++){if(grid[rr].includes(cell)){anchor=rr;break}}
      if(anchor===r){
        const next=table.rows[r+1];
        if(next){
          const {start}=spanOf(grid,r,cell);
          let ref=null;
          for(const nc of next.cells){
            const s=spanOf(tableMatrix(table).grid,r+1,nc).start;
            if(s>start){ref=nc;break}
          }
          next.insertBefore(cell,ref);
        }
      }
    }
  }
  tr.remove();
  if(!table.rows.length)table.remove();
}
function deleteColumn(table,c){
  const {grid,rows}=tableMatrix(table);
  const done=new Set;
  for(let r=0;r<rows;r++){
    const cell=grid[r][c];
    if(!cell||done.has(cell))continue;
    done.add(cell);
    if((cell.colSpan||1)>1)cell.colSpan--;
    else cell.remove();
  }
  for(const tr of [...table.rows])if(!tr.cells.length)tr.remove();
  if(!table.rows.length)table.remove();
}
function toggleHeader(table){
  const tr=table.rows[0];if(!tr)return;
  const isHead=[...tr.cells].every(c=>c.tagName==="TH");
  [...tr.cells].forEach(c=>{
    const el=document.createElement(isHead?"td":"th");
    el.innerHTML=c.innerHTML;
    [...c.attributes].forEach(a=>el.setAttribute(a.name,a.value));
    tr.replaceChild(el,c);
  });
}
/* 選択セル矩形 */
function selectionRect(table){
  const sel=window.getSelection();
  if(!sel||!sel.anchorNode||!sel.focusNode)return null;
  const a=cellOf(sel.anchorNode),f=cellOf(sel.focusNode);
  if(!a||!f||a.closest("table")!==table||f.closest("table")!==table)return null;
  const {grid,rows,cols}=tableMatrix(table);
  const posOf=cell=>{for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(grid[r][c]===cell)return[r,c];return null};
  const p1=posOf(a),p2=posOf(f);
  if(!p1||!p2)return null;
  let rMin=Math.min(p1[0],p2[0]),rMax=Math.max(p1[0],p2[0]);
  let cMin=Math.min(p1[1],p2[1]),cMax=Math.max(p1[1],p2[1]);
  for(let pass=0;pass<6;pass++){
    let grew=false;
    for(let r=rMin;r<=rMax;r++)for(let c=cMin;c<=cMax;c++){
      const cell=grid[r]?.[c];if(!cell)continue;
      for(let rr=0;rr<rows;rr++)if(grid[rr].includes(cell)){
        const {start,end}=spanOf(grid,rr,cell);
        const top=rr,bottom=rr+(cell.rowSpan||1)-1;
        if(start<cMin){cMin=start;grew=true}
        if(end>cMax){cMax=end;grew=true}
        if(top<rMin){rMin=top;grew=true}
        if(bottom>rMax){rMax=bottom;grew=true}
        break;
      }
    }
    if(!grew)break;
  }
  return{grid,rows,cols,rMin,rMax,cMin,cMax};
}
function clearSelCells(){$$(".editor .selcell").forEach(el=>el.classList.remove("selcell"))}
function markRect(rect){
  const seen=new Set;
  for(let r=rect.rMin;r<=rect.rMax;r++)for(let c=rect.cMin;c<=rect.cMax;c++){
    const cell=rect.grid[r]?.[c];
    if(cell&&!seen.has(cell)){seen.add(cell);cell.classList.add("selcell")}
  }
}
function mergeSelectedCells(){
  const sel=window.getSelection();
  const cell=cellOf(sel?.anchorNode);
  if(!cell)return false;
  const table=cell.closest("table");
  const rect=selectionRect(table);
  if(!rect)return false;
  if(rect.rMin===rect.rMax&&rect.cMin===rect.cMax)return false;
  pushUndoNow();
  const anchor=rect.grid[rect.rMin][rect.cMin];
  const seen=new Set([anchor]);
  for(let r=rect.rMin;r<=rect.rMax;r++)for(let c=rect.cMin;c<=rect.cMax;c++){
    const cell=rect.grid[r]?.[c];
    if(!cell||seen.has(cell))continue;
    seen.add(cell);
    if(cell.textContent.trim())anchor.appendChild(document.createElement("br")),
      anchor.appendChild(document.createTextNode(cell.textContent.trim()));
    cell.remove();
  }
  anchor.rowSpan=rect.rMax-rect.rMin+1;
  anchor.colSpan=rect.cMax-rect.cMin+1;
  placeCaretStart(anchor);
  markModified("セルを結合しました");
  return true;
}

/* ---------------- 表ツール（フロートバー） ---------------- */
function anchorCell(){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return null;
  return cellOf(sel.anchorNode)||cellOf(sel.focusNode);
}
function updateTools(){
  const tt=$("#table-tools");
  const cell=anchorCell();
  clearSelCells();
  if(!cell){tt.classList.add("hidden");return}
  const table=cell.closest("table");
  const rect=selectionRect(table);
  const multi=rect&&(rect.rMin!==rect.rMax||rect.cMin!==rect.cMax);
  if(rect&&multi)markRect(rect);
  $("#tt-merge").disabled=!multi;
  tt.classList.remove("hidden");
  const r=table.getBoundingClientRect();
  const w=tt.offsetWidth,h=tt.offsetHeight;
  let top=r.top-h-8;
  if(top<52)top=Math.min(r.bottom+8,innerHeight-h-8);
  tt.style.top=Math.max(6,top)+"px";
  tt.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+"px";
}
$("#table-tools").addEventListener("mousedown",e=>e.preventDefault());
$("#table-tools").addEventListener("click",e=>{
  const btn=e.target.closest("[data-op]");if(!btn)return;
  const cell=anchorCell();if(!cell)return;
  const table=cell.closest("table");
  const op=btn.dataset.op;
  const tr=cell.parentElement;
  const rIdx=[...table.rows].indexOf(tr);
  const {grid}=tableMatrix(table);
  const cIdx=spanOf(grid,rIdx,cell).start;
  if(op!=="merge"&&op!=="delTable")pushUndoNow();
  switch(op){
    case"rowBefore":insertRow(table,rIdx,false);markModified("上に行を挿入しました");break;
    case"rowAfter":insertRow(table,rIdx,true);markModified("下に行を挿入しました");break;
    case"colBefore":insertColumn(table,cIdx,false);markModified("左に列を挿入しました");break;
    case"colAfter":insertColumn(table,cIdx,true);markModified("右に列を挿入しました");break;
    case"delRow":pushUndoNow();deleteRow(table,rIdx);markModified("行を削除しました");break;
    case"delCol":pushUndoNow();deleteColumn(table,cIdx);markModified("列を削除しました");break;
    case"delTable":{
      pushUndoNow();
      const ed=table.closest(".editor");
      const p=table.nextElementSibling||table.previousElementSibling;
      table.remove();
      if(p&&/^(P|DIV|H1|H2)$/.test(p.tagName))placeCaretStart(p);
      else if(ed)placeCaretEnd(ed);
      markModified("表を削除しました");
      break;}
    case"header":pushUndoNow();toggleHeader(table);markModified("ヘッダー行を切り替えました");break;
    case"merge":mergeSelectedCells();break;
  }
  updateTools();scheduleCleanup();
});

function insertTableAt(rows,cols){
  let html="<table><tbody>";
  for(let r=0;r<rows;r++){
    html+="<tr>";

    html+="</tr>";
  }
  html+="</tbody></table><p><br></p>";
  insertHtmlAtSelection(html,`${rows}×${cols} の表を挿入しました`);
  const ed=getActiveEditor();
  const tables=$$("table",ed);
  const t=tables[tables.length-1];
  if(t){const c=t.querySelector("td,th");if(c)placeCaretStart(c)}
}

/* ---------------- モーダル ---------------- */
function showModal(opts){
  return new Promise(resolve=>{
    const overlay=$("#modal-overlay"),body=$("#modal-body"),foot=$("#modal-foot");
    $("#modal-title").textContent=opts.title||"";
    body.innerHTML="";foot.innerHTML="";
    let finished=false;
    const fields={};
    if(opts.message){
      const m=document.createElement("div");m.className="msg";m.textContent=opts.message;
      body.appendChild(m);
    }
    (opts.fields||[]).forEach(f=>{
      const wrap=document.createElement("div");wrap.className="m-field";
      if(f.label){const l=document.createElement("label");l.textContent=f.label;wrap.appendChild(l)}
      let input;
      if(f.type==="textarea"){
        input=document.createElement("textarea");
        input.value=f.value||"";
      }else if(f.type==="select"){
        input=document.createElement("select");
        (f.options||[]).forEach(o=>{
          const op=document.createElement("option");
          op.value=o.value;op.textContent=o.label;
          if(o.value===f.value)op.selected=true;
          input.appendChild(op);
        });
      }else{
        input=document.createElement("input");
        input.type=f.type||"text";
        input.value=f.value??"";
        if(f.type==="text")input.setAttribute("data-select","1");
      }
      fields[f.id]=input;
      wrap.appendChild(input);
      body.appendChild(wrap);
    });
    function finish(value){
      if(finished)return;
      finished=true;
      document.removeEventListener("keydown",onKey,true);
      overlay.classList.add("hidden");
      const f={};
      for(const k in fields)f[k]=fields[k].value;
      resolve({value,f});
    }
    function onKey(e){
      if(e.isComposing)return;
      if(e.key==="Escape"){e.preventDefault();finish(opts.cancelValue??null)}
      if(e.key==="Enter"&&!Object.values(fields).some(i=>i.tagName==="TEXTAREA")&&e.target.tagName!=="TEXTAREA"){
        e.preventDefault();
        const prim=opts.buttons.find(b=>b.primary)||opts.buttons[0];
        finish(prim.value);
      }
    }
    opts.buttons.forEach(spec=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="btn"+(spec.primary?" primary":"");
      b.textContent=spec.label;
      b.addEventListener("click",()=>finish(spec.value));
      foot.appendChild(b);
    });
    $("#modal-close").onclick=()=>finish(opts.cancelValue??null);
    overlay.onmousedown=e=>{if(e.target===overlay)finish(opts.cancelValue??null)};
    document.addEventListener("keydown",onKey,true);
    overlay.classList.remove("hidden");
    setTimeout(()=>{
      const first=Object.values(fields)[0];
      if(first){first.focus();if(first.dataset.select)first.select()}
      else foot.querySelector(".primary,.btn")?.focus();
    },20);
  });
}

function downloadBlob(name,blob){
  const a=document.createElement("a"),u=URL.createObjectURL(blob);
  a.href=u;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),10000);
}
async function saveDocument(saveAs){
  const json=JSON.stringify(documentData(),null,2);
  if(!saveAs&&fileHandle?.createWritable){
    try{
      const w=await fileHandle.createWritable();
      await w.write(json);await w.close();
      currentFileName=fileHandle.name;
      modified=false;updateTitle();
      setStatus(`保存しました: ${currentFileName}`);
      saveDraft();return true;
    }catch(e){console.warn(e)}
  }
  const suggested=(!saveAs&&currentFileName)?currentFileName:defaultFilename();
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({suggestedName:suggested,
        types:[{description:"迪温書院文書",accept:{"application/json":[EXT]}}]});
      const w=await h.createWritable();
      await w.write(json);await w.close();
      fileHandle=h;currentFileName=h.name;
      modified=false;updateTitle();
      setStatus(`保存しました: ${currentFileName}`);
      saveDraft();return true;
    }catch(e){if(e?.name==="AbortError")return false}
  }
  const res=await showModal({
    title:"名前を付けて保存",
    fields:[{id:"name",label:"ファイル名",type:"text",value:suggested}],
    buttons:[{label:"保存",value:"save",primary:true},{label:"キャンセル",value:"cancel"}],
    cancelValue:"cancel"
  });
  if(res.value!=="save")return false;
  let name=sanitizeFilename(res.f.name||suggested);
  if(!name.toLowerCase().endsWith(EXT))name+=EXT;
  downloadBlob(name,new Blob([json],{type:"application/json;charset=utf-8"}));
  currentFileName=name;fileHandle=null;
  modified=false;updateTitle();
  setStatus(`ダウンロードしました: ${name}`);
  saveDraft();return true;
}
function applyDocumentData(data){
  $("#pages").innerHTML="";
  const pages=Array.isArray(data.pages)&&data.pages.length?data.pages:[""];
  pages.forEach(p=>createPage(typeof p==="string"?p:(p?.html||"")));
  activePageIndex=0;
  savedRange=null;
  refreshPageNumbers();updateStats();
  requestAnimationFrame(()=>rebalanceAll());
}
async function loadDocumentFile(file){
  try{
    const data=JSON.parse(await file.text());
    if(!data||data.format!==FORMAT||!Array.isArray(data.pages))
      throw new Error("対応していない文書形式です。");
    applyDocumentData(data);
    currentFileName=file.name;fileHandle=null;
    modified=false;undoStack=[];redoStack=[];
    updateTitle();
    setStatus(`開きました: ${file.name}`);
    saveDraft();
  }catch(e){
    await alertInfo("読込エラー",String(e?.message||e));
  }
}
function pickFile(){
  return new Promise(res=>{
    const inp=$("#file-input");
    inp.value="";
    const h=()=>{inp.removeEventListener("change",h);res(inp.files?.[0]||null)};
    inp.addEventListener("change",h);
    inp.click();
  });
}
async function openDocument(){
  if(!(await maybeSave()))return;
  if(window.showOpenFilePicker){
    try{
      const [h]=await window.showOpenFilePicker({multiple:false,
        types:[{description:"迪温書院文書",accept:{"application/json":[EXT]}}]});
      fileHandle=h;
      await loadDocumentFile(await h.getFile());
      return;
    }catch(e){if(e?.name==="AbortError")return}
  }
  const f=await pickFile();
  if(f)await loadDocumentFile(f);
}
async function newDocument(){
  if(!(await maybeSave()))return;
  $("#pages").innerHTML="";
  createPage(defaultContent());
  activePageIndex=0;currentFileName=null;fileHandle=null;
  modified=false;undoStack=[];redoStack=[];savedRange=null;
  updateTitle();refreshPageNumbers();updateStats();
  try{localStorage.removeItem(DRAFT_KEY)}catch(_){}
  setDraftState("");
  getActiveEditor()?.focus();
  setStatus("新しい文書を作成しました");
}
async function maybeSave(){
  if(!modified)return true;
  const r=await showModal({
    title:"未保存の変更",
    message:"変更内容を保存しますか？",
    buttons:[{label:"保存",value:"save",primary:true},{label:"破棄",value:"discard"},{label:"キャンセル",value:"cancel"}],
    cancelValue:"cancel"
  });
  if(r.value==="save")return await saveDocument(false);
  return r.value==="discard";
}
function defaultContent(){
  return `<h1>研究題目</h1><p>ここに本文を入力してください。段落がページの端を超えると、自動的に次のページへ送られます。</p>`;
}

/* ---------------- 下書き自動保存 ---------------- */
function setDraftState(t){$("#draft-state").textContent=t}
function saveDraft(){
  try{
    localStorage.setItem(DRAFT_KEY,JSON.stringify({name:currentFileName,data:documentData()}));
    const n=new Date(),p=x=>String(x).padStart(2,"0");
    setDraftState(`自動保存 ${p(n.getHours())}:${p(n.getMinutes())}`);
  }catch(_){}
}
function scheduleDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,1200)}
function tryRestoreDraft(){
  try{
    const raw=localStorage.getItem(DRAFT_KEY);
    if(!raw)return false;
    const o=JSON.parse(raw);
    if(!o?.data||!Array.isArray(o.data.pages)||!o.data.pages.length)return false;
    applyDocumentData(o.data);
    currentFileName=o.name||null;
    modified=false;
    updateTitle();
    setStatus("前回閉じたときの文書を復元しました");
    return true;
  }catch(_){return false}
}

/* ---------------- ズーム ---------------- */
function setZoom(pct,quiet){
  zoomPercent=Math.max(50,Math.min(160,Math.round(Number(pct)||100)));
  $("#page-stage").style.zoom=String(zoomPercent/100);
  $("#zoom-label").textContent=`${zoomPercent}%`;
  $("#zoom-slider").value=String(zoomPercent);
  if(!quiet)setStatus(`表示倍率: ${zoomPercent}%`);
  updateTools();
}
function fitWidth(){
  const avail=$("#workspace").clientWidth-112;
  const pagePx=176*96/25.4;
  setZoom(Math.floor(avail/pagePx*100));
  setStatus("ページ幅に合わせて表示しています");
}

/* ---------------- 印刷 ---------------- */
function printDoc(){
  rebalanceAll();
  document.activeElement?.blur?.();
  setStatus("印刷ダイアログを開きます。保存先で「PDF に保存」を選ぶと PDF として出力できます。");
  setTimeout(()=>window.print(),80);
}
window.addEventListener("afterprint",()=>setStatus("印刷ダイアログを閉じました。"));

/* ---------------- ページ移動 ---------------- */
function moveToPage(offset){
  const ps=getPages();
  if(!ps.length)return;
  activePageIndex=offset<-100?0:Math.max(0,Math.min(ps.length-1,activePageIndex+offset));
  ps[activePageIndex].scrollIntoView({behavior:"smooth",block:"center"});
  getActiveEditor()?.focus();
  updateStats();
  setStatus(`${activePageIndex+1} ページ目へ移動しました`);
}

/* ---------------- 全体イベント ---------------- */
function setupEvents(){
  $("#zoom-slider").addEventListener("input",e=>setZoom(e.target.value,true));
  $("#zoom-in").addEventListener("click",()=>setZoom(zoomPercent+10));
  $("#zoom-out").addEventListener("click",()=>setZoom(zoomPercent-10));
  $("#zoom-fit").addEventListener("click",fitWidth);
  $("#file-menu-btn").addEventListener("click",e=>{e.stopPropagation();hidePops();showFileMenu()});
  $("#help-btn").addEventListener("click",showHelp);
  $("#doc-title").addEventListener("change",e=>{
    currentFileName=sanitizeName(e.target.value);
    fileHandle=null;
    updateTitle();saveDraft();
    setStatus(`文書名を「${currentFileName}」に変更しました`);
  });
  $("#doc-title").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});

  document.addEventListener("click",e=>{
    if(!e.target.closest("#context-menu"))hideMenus();
    if(!e.target.closest("#grid-pop")&&!e.target.closest('[data-op]')&&!e.target.closest(".rb"))hidePops();
  });
  document.addEventListener("keydown",async e=>{
    if(e.key==="Escape"){hideMenus();hidePops();return}
    const mod=e.ctrlKey||e.metaKey;
    if(!mod)return;
    const k=e.key.toLowerCase();
    if(k==="s"){e.preventDefault();await saveDocument(e.shiftKey)}
    else if(k==="o"){e.preventDefault();await openDocument()}
    else if(k==="n"){e.preventDefault();await newDocument()}
    else if(k==="p"){e.preventDefault();printDoc()}
    else if(k==="z"&&!e.shiftKey){e.preventDefault();undo()}
    else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo()}
    else if(k==="b"){e.preventDefault();actions.bold.run()}
    else if(k==="i"){e.preventDefault();actions.italic.run()}
    else if(k==="u"){e.preventDefault();actions.underline.run()}
  });
  document.addEventListener("selectionchange",()=>{
    const sel=window.getSelection();
    if(!sel?.rangeCount)return;
    const node=sel.anchorNode;
    const idx=getPages().findIndex(p=>editorOf(p).contains(node));
    if(idx>=0){
      if(idx!==activePageIndex){activePageIndex=idx;updateStats()}
      saveSelection();
    }
    updateTools();
  });
  $("#workspace").addEventListener("scroll",updateTools);
  window.addEventListener("resize",updateTools);
  $("#workspace").addEventListener("wheel",e=>{
    if(e.ctrlKey||e.metaKey){
      e.preventDefault();
      setZoom(zoomPercent+(e.deltaY<0?5:-5),true);
    }
  },{passive:false});
  window.addEventListener("dragover",e=>e.preventDefault());
  window.addEventListener("drop",async e=>{
    e.preventDefault();
    const f=e.dataTransfer?.files?.[0];
    if(f&&f.name.toLowerCase().endsWith(EXT)){
      if(await maybeSave()){fileHandle=null;await loadDocumentFile(f)}
    }
  });
  window.addEventListener("beforeunload",e=>{
    if(modified){e.preventDefault();e.returnValue=""}
  });
}

/* ---------------- クイックアクセス ---------------- */
function buildQuick(){
  const box=$("#quick-actions");
  ["save","undo","redo","print"].forEach(id=>{
    const a=actions[id];
    const b=document.createElement("button");
    b.type="button";b.className="tb-ico";b.title=a.label;
    b.innerHTML=icon(a.icon);
    b.addEventListener("mousedown",e=>{if(e.button===0)e.preventDefault()});
    b.addEventListener("click",()=>{hideMenus();a.run()});
    box.appendChild(b);
  });
}

/* ---------------- 起動 ---------------- */
function init(){
  try{
    document.execCommand("styleWithCSS",false,true);
    document.execCommand("defaultParagraphSeparator",false,"p");
  }catch(_){}
  buildQuick();
  buildRibbon();
  buildGridPicker();
  setupEvents();

  if(!tryRestoreDraft()){
    createPage(defaultContent());
    activePageIndex=0;
  }
  modified=false;
  updateTitle();updateStats();
  if($("#workspace").clientWidth<760)setZoom(Math.max(50,Math.floor(($("#workspace").clientWidth-112)/(176*96/25.4)*100)),true);
  else setZoom(100,true);

  setTimeout(()=>{
    const sp=$("#splash");
    sp.classList.add("out");
    setTimeout(()=>sp.remove(),550);
    getActiveEditor()?.focus();
    setStatus("準備完了。Ctrl+S で保存、Ctrl+P で印刷・PDF 出力。表の中にカーソルを置くと表ツールが表示されます。");
  },1150);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
</script>
</body>
