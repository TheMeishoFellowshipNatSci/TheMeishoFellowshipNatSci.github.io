function btn(id,lg=false){const a=actions[id],b=document.createElement("button");b.className="rb"+(lg?" lg":"");b.innerHTML=(a[1]?ico(a[1]):"")+`<span>${a[0]}</span>`;b.title=a[0];b.onmousedown=e=>e.preventDefault();b.onclick=a[2];return b}function group(title,ids,large=[]){const g=document.createElement("div");g.className="group";const r=document.createElement("div");r.className="grow";ids.forEach(id=>r.append(btn(id,large.includes(id))));g.append(r,Object.assign(document.createElement("div"),{className:"gtitle",textContent:title}));return g}

function buildRibbon(){const defs=[["ホーム",p=>{p.append(group("クリップボード",["save"]));p.append(columnGroup("文字",[["bold","italic"],["underline","strike"]]));p.append(columnGroup("段落",[["ul","ol"],["outdent","indent"],["left","center"],["right","justify"]]))}],["挿入",p=>{p.append(group("表",["table"],["table"]));p.append(group("言語学",["example","gloss","ipa","tree"]));p.append(group("ページ",["page","break"],["page"]))}],["書式",p=>{const g=group("文字サイズ",[]);const s=document.createElement("select");s.className="rctl";[8,9,10,11,12,14,16,18,20,24,28].forEach(n=>s.add(new Option(n+" pt",n)));s.value=11;s.onchange=()=>cmd("fontSize",Math.max(1,Math.min(7,Math.round(s.value/4))),"文字サイズを変更しました");$(".grow",g).append(s);p.append(g);const c=group("文字色",[]);["#111111","#c00000","#e26b0a","#548235","#2f5597","#7030a0"].forEach(x=>{const b=document.createElement("button");b.className="sw";b.style.background=x;b.onclick=()=>cmd("foreColor",x,"文字色を変更しました");$(".grow",c).append(b)});p.append(c)}],["表示",p=>{p.append(group("表示倍率",["fit","actual"]));const g=group("ページ表示",[]);const b=document.createElement("button");b.className="rb on";b.textContent="飾り表示";b.onclick=()=>{$("#page-stage").classList.toggle("no-decor");b.classList.toggle("on")};$(".grow",g).append(b);p.append(g);p.append(infoGroup())}]];defs.forEach(([n,build],i)=>{const t=document.createElement("button");t.className="tab";t.textContent=n;t.onclick=()=>selectTab(i);$("#tabs").append(t);const p=document.createElement("div");p.className="rpage";build(p);$("#rpages").append(p)});selectTab(0)}function selectTab(i){$$('.tab').forEach((x,j)=>x.classList.toggle('active',i===j));$$('.rpage').forEach((x,j)=>x.classList.toggle('show',i===j))}
function showMenu(items){const m=$("#menu");m.innerHTML="";items.forEach(x=>{if(x==="sep"){m.append(Object.assign(document.createElement("div"),{className:"menu-sep"}));return}const d=document.createElement("div");d.className="menu-item";d.textContent=x[0];d.onclick=()=>{m.classList.add("hidden");x[1]()};m.append(d)});const r=$("#fileBtn").getBoundingClientRect();m.style.left=r.left+"px";m.style.top=r.bottom+"px";m.classList.remove("hidden")}
function modal(title,fields,message=""){return new Promise(resolve=>{const body=$("#mbody"),foot=$("#mfoot");$("#mtitle").textContent=title;body.innerHTML=message?`<div>${esc(message)}</div>`:"";foot.innerHTML="";const map={};fields.forEach(f=>{const w=document.createElement("div");w.className="field";w.innerHTML=f.label?`<label>${esc(f.label)}</label>`:"";const x=document.createElement(f.type==="textarea"?"textarea":f.type==="select"?"select":"input");if(x.tagName==="INPUT")x.type=f.type||"text";if(f.options)f.options.forEach(o=>x.add(new Option(o.label,o.value)));x.value=f.value||"";map[f.id]=x;w.append(x);body.append(w)});const done=v=>{$("#modalBg").classList.add("hidden");const out={};Object.keys(map).forEach(k=>out[k]=map[k].value);resolve(v?out:null)};[["OK",1,"primary"],["キャンセル",0,""]].forEach(a=>{const b=document.createElement("button");b.className="btn "+a[2];b.textContent=a[0];b.onclick=()=>done(a[1]);foot.append(b)});$("#mclose").onclick=()=>done(0);$("#modalBg").classList.remove("hidden");setTimeout(()=>Object.values(map)[0]?.focus(),10)})}
async function askTable(){const r=await modal("表を挿入",[{id:"rows",label:"行数",type:"number",value:"3"},{id:"cols",label:"列数",type:"number",value:"3"}]);if(!r)return;let h="<table><tbody>";for(let y=0;y<Math.min(30,+r.rows||3);y++){h+="<tr>";for(let x=0;x<Math.min(12,+r.cols||3);x++)h+="<td><br></td>";h+="</tr>"}insertHtml(h+"</tbody></table><p><br></p>","表を挿入しました")}async function askExample(){const r=await modal("言語例を挿入",[{id:"text",label:"例文",value:"The student read the book."}]);if(r)insertHtml(`<div class="linguistic-example"><span>(${$$(".linguistic-example").length+1})</span><span>${esc(r.text)}</span></div>`,"言語例を挿入しました")}async function askIPA(){const r=await modal("IPAを挿入",[{id:"text",label:"音声表記",value:"təˈmɑːtəʊ"},{id:"wrap",label:"囲み",type:"select",options:[{value:"sq",label:"[ ]"},{value:"sl",label:"/ /"},{value:"no",label:"なし"}]}]);if(r){const t=r.wrap==="sq"?`[${r.text}]`:r.wrap==="sl"?`/${r.text}/`:r.text;insertHtml(`<span class="ipa-text">${esc(t)}</span>`,"IPAを挿入しました")}}async function askGloss(){const r=await modal("グロスを挿入",[{id:"src",label:"原文",value:"Watashi-wa gengogaku-o benkyou-suru."},{id:"gls",label:"グロス",value:"1SG-TOP linguistics-ACC study-NPST"},{id:"tr",label:"訳文",value:"私は言語学を勉強する。"}]);if(!r)return;const a=r.src.split(/\s+/),b=r.gls.split(/\s+/),n=Math.max(a.length,b.length);let cells="";for(let i=0;i<n;i++)cells+=`<td><em>${esc(a[i]||"")}</em><br>${esc(b[i]||"")}</td>`;insertHtml(`<div class="linguistic-example"><span>(${$$(".linguistic-example").length+1})</span><span><table class="gloss-table"><tr>${cells}</tr></table>‘${esc(r.tr)}’</span></div>`,"グロスを挿入しました")}async function askTree(){const r=await modal("統語樹を挿入",[{id:"text",type:"textarea",value:"CP\n├─ DP  The student\n└─ TP\n   └─ VP  read the book"}]);if(r)insertHtml(`<div class="tree-block">${esc(r.text)}</div>`,"統語樹を挿入しました")}

function init(){["save","undo","redo","print"].forEach(id=>{const b=document.createElement("button");b.innerHTML=ico(actions[id][1]);b.title=actions[id][0];b.onclick=actions[id][2];$("#qat").append(b)});buildRibbon();if(!restoreDraft())page("<h1>研究題目</h1><p>ここに本文を入力してください。段落がページの端を超えると、自動的に次のページへ送られます。</p>");stats();setZoom(100);$("#fileBtn").onclick=e=>{e.stopPropagation();showMenu([["新規作成",()=>{if(!modified||confirm("変更を破棄しますか？")){$("#pages").innerHTML="";page("");currentName=null;modified=false}}],["開く",()=>$("#fileInput").click()],["保存",()=>saveDoc()],"sep",["印刷 / PDF",()=>print()],["バージョン情報",()=>alert(`${APP}\nVersion 1.0\n${LICENSE}`)]])};$("#fileInput").onchange=e=>e.target.files[0]&&openDoc(e.target.files[0]);$("#docTitle").onchange=e=>{currentName=e.target.value.trim()||"無題";mark("文書名を変更しました")};$("#zoom").oninput=e=>setZoom(e.target.value);$("#zin").onclick=()=>setZoom(zoom+10);$("#zout").onclick=()=>setZoom(zoom-10);document.onclick=()=>$("#menu").classList.add("hidden");document.onkeydown=e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();if(k==="s"){e.preventDefault();saveDoc()}else if(k==="o"){e.preventDefault();$("#fileInput").click()}else if(k==="p"){e.preventDefault();print()}else if(k==="z"){e.preventDefault();doUndo()}else if(k==="y"){e.preventDefault();doRedo()}else if(k==="b"){e.preventDefault();cmd("bold")}else if(k==="i"){e.preventDefault();cmd("italic")}else if(k==="u"){e.preventDefault();cmd("underline")}};setTimeout(()=>{$("#splash").classList.add("out");setTimeout(()=>$("#splash").remove(),550);activeEd().focus();status("準備完了。Ctrl+Sで保存、Ctrl+Pで印刷・PDF出力。")},1000)}init();
